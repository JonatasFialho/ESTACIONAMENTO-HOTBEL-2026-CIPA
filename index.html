<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estacionamento CIPA 25/26 - Supabase Cloud</title>

    <!-- Favicon -->
    <link rel="icon" href="https://i.ibb.co/MDYt0GfF/Chat-GPT-Image-16-de-out-de-2025-21-55-09.png">

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Ícones (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-color: #FF6A14; 
            --primary-dark: #e05505;
            --neon-1: #ffffff;
            --neon-2: #2da364;
            --bg-dark: #1c1c1c;
            --form-bg: #232323;
            --white: #fff;

            --app-bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
            --border-color: #eeeeee;
            --input-bg: #ffffff;
            --table-hover: #fcfcfc;
            --header-bg: #ffffff;
        }

        body.theme-orange {
            --app-bg: #fff5ed; 
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --text-main: #4a2711;
            --border-color: #ffd8bd;
            --input-bg: #fffcf9;
            --table-hover: #fff9f4;
            --primary-color: #FF6A14; 
        }

        body.theme-green {
            --app-bg: #f1f9f5; 
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --text-main: #1b3a2a;
            --border-color: #c8e6d9;
            --input-bg: #f8fdfb;
            --table-hover: #f3faf7;
            --primary-color: #2da364; 
        }

        body.theme-dark {
            --app-bg: #121212;
            --card-bg: #1e1e1e;
            --header-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --input-bg: #2d2d2d;
            --table-hover: #252525;
            --white: #e0e0e0;
            --primary-color: #FF6A14;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.site-mode { background: var(--app-bg); }

        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            z-index: 9999;
            background: var(--bg-dark);
            padding: 20px;
        }

        .snake-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 560px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            overflow: hidden;
        }

        .snake-wrapper::before, .snake-wrapper::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            z-index: 1;
            transform-origin: center;
            animation: animateSnake 6s linear infinite;
        }

        .snake-wrapper::before { background: linear-gradient(0deg, transparent, transparent, var(--neon-1), var(--neon-1), var(--neon-1)); }
        .snake-wrapper::after { background: linear-gradient(0deg, transparent, transparent, var(--neon-2), var(--neon-2), var(--neon-2)); animation-delay: -3s; }

        @keyframes animateSnake { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .login-container { 
            background-color: var(--form-bg); 
            border-radius: 10px; 
            position: absolute; 
            z-index: 2; 
            inset: 4px; 
            overflow: hidden; 
            box-shadow: 0 14px 28px rgba(0,0,0,0.5); 
        }

        form#loginForm { 
            background-color: var(--form-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            padding: 20px 30px; 
            height: 100%; 
            text-align: center; 
            color: #fff; 
        }

        .login-logo {
            width: 110px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .input-login-group { position: relative; width: 100%; margin: 8px 0; }
        .input-login-group i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #888; }
        .input-login { background-color: #333; border: none; padding: 12px 15px 12px 40px; width: 100%; border-radius: 8px; color: #fff; outline: none; font-size: 16px; }
        .btn-login { border-radius: 20px; border: 1px solid var(--primary-color); background-color: var(--primary-color); color: #FFFFFF; font-size: 14px; font-weight: bold; padding: 12px 45px; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.3s; width: 100%; }
        
        #main-app { display: none; width: 100%; }

        .header-site {
            background: var(--header-bg);
            max-width: 1200px;
            width: calc(100% - 20px);
            margin: 0 auto; 
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border-bottom: 1px solid var(--border-color);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-title { 
            color: var(--primary-color); 
            font-weight: 800; 
            font-size: 18px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .header-title img { width: 30px; }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-logout, .theme-trigger-btn {
            background: var(--app-bg); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--text-main); font-size: 12px;
        }

        .content-wrapper { max-width: 1200px; margin: 15px auto; padding: 0 10px; width: 100%; }

        .site-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tabs { 
            display: flex; 
            gap: 5px; 
            margin-bottom: 20px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 10px; 
            overflow-x: auto;
            white-space: nowrap;
        }
        .tab-btn { background: var(--app-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .tab-content { display: none !important; }
        .tab-content.active { display: block !important; }

        h2 { color: var(--primary-color); margin-bottom: 15px; font-weight: 700; border-left: 5px solid var(--primary-color); padding-left: 12px; font-size: 18px; }

        input, select, .btn-action {
            width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 14px; outline: none;
        }
        .btn-action { background: var(--primary-color); color: white; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 15px; padding: 10px; background: var(--card-bg); }
            td { border: none; position: relative; padding-left: 45% !important; text-align: right; border-bottom: 1px solid var(--border-color); min-height: 40px; display: flex; align-items: center; justify-content: flex-end; }
            td:last-child { border-bottom: none; }
            td::before {
                content: attr(data-label);
                position: absolute;
                left: 10px;
                width: 40%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: 700;
                font-size: 10px;
                color: var(--text-muted);
                text-transform: uppercase;
            }
        }

        table { width: 100%; margin-top: 15px; border-collapse: separate; border-spacing: 0; border: 1px solid var(--border-color); border-radius: 10px; overflow: visible; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        th { background-color: var(--app-bg); color: var(--text-muted); text-transform: uppercase; font-size: 10px; font-weight: 700; }

        .img-historico { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); }
        .btn-acao-menu { background: var(--app-bg); border: 1px solid var(--border-color); color: var(--text-main); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
        
        .acoes-wrapper { position: relative; display: inline-block; }
        .menu-opcoes { 
            display: none; position: absolute; right: 0; bottom: 42px; background: var(--card-bg); min-width: 140px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); z-index: 1050; border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;
        }
        .menu-opcoes.active { display: block; }
        .menu-opcoes button { width: 100%; border: none; text-align: left; padding: 10px 15px; background: transparent; cursor: pointer; font-size: 13px; color: var(--text-main); border-bottom: 1px solid var(--border-color); }
        .menu-opcoes button:last-child { border-bottom: none; }

        #modalDetalhes { display: none; position: fixed; z-index: 9000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 15px; }
        #modal { display: none; position: fixed; z-index: 10000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; padding: 10px; }
        
        #notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 20px; background: var(--primary-color); color: white; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 11000; display: none; font-size: 13px; text-align: center; width: 80%; max-width: 300px; }

        .filter-group { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px; background: var(--app-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); flex-wrap: wrap; }
        .filter-group > div { flex: 1; min-width: 120px; }
        .filter-group label { font-size: 10px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px; }

        .search-input-wrapper { position: relative; }
        .search-input-wrapper i { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); color: var(--text-muted); }

        .total-badge {
            background: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 10px;
        }

        .theme-menu {
            display: none; position: absolute; right: 0; top: 40px; background: var(--card-bg); min-width: 150px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 1100; border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden;
        }
        .theme-menu.active { display: block; }
        .theme-menu button { width: 100%; border: none; text-align: left; padding: 10px 15px; background: transparent; cursor: pointer; font-size: 13px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

        .modal-content-detalhes { background: var(--card-bg); width: 100%; max-width: 600px; max-height: 85vh; padding: 25px; border-radius: 16px; overflow-y: auto; position: relative; }
        .fechar-btn { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        .detalhe-item { border-bottom: 1px solid var(--border-color); padding: 15px 0; display: flex; gap: 15px; align-items: center; }
        .img-detalhe { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }

        .photo-input-container {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 6px 0;
        }
        .photo-input-container input { margin: 0; }
        .btn-upload-trigger {
            width: auto;
            min-width: 120px;
            padding: 12px;
            background: var(--app-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-upload-trigger:hover { background: var(--border-color); }
        .btn-upload-trigger.has-file { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        @media (max-width: 600px) {
            .header-title span span { display: none; }
            .site-card { padding: 15px; }
            h2 { font-size: 16px; }
            .photo-input-container { flex-direction: column; align-items: stretch; }
            .btn-upload-trigger { width: 100%; }
        }
    </style>
</head>
<body class="site-mode-off theme-green"> 

<div id="notification"></div>

<!-- TELA DE LOGIN -->
<div id="login-screen">
    <div class="snake-wrapper">
        <div class="login-container">
            <div class="form-container">
                <form id="loginForm" action="javascript:void(0)">
                    <img src="https://i.ibb.co/svKWyZ49/cipa-logo.png" alt="CIPA Logo" class="login-logo">
                    
                    <h1 style="color: var(--primary-color); font-size: 24px;">Acesso CIPA</h1>
                    <p style="font-size: 12px; margin: 10px 0; color: #aaa;">Estacionamento 25/26</p>
                    <div class="input-login-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="emailLogin" class="input-login" placeholder="E-mail">
                    </div>
                    <div class="input-login-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="passLogin" class="input-login" placeholder="Senha">
                    </div>
                    <button id="btnLoginAction" class="btn-login" onclick="realizarLogin()">Entrar</button>
                    <img src="https://i.ibb.co/MDYt0GfF/Chat-GPT-Image-16-de-out-de-2025-21-55-09.png" alt="CIPA" style="width: 40px; margin-top: 20px; border-radius: 8px; opacity: 0.6;">
                </form>
            </div>
        </div>
    </div>
</div>

<!-- INTERFACE PRINCIPAL -->
<div id="main-app">
    <header class="header-site">
        <div class="header-title">
            <img src="https://i.ibb.co/svKWyZ49/cipa-logo.png" alt="CIPA Logo">
            <span>Estacionamento <span style="color:var(--text-main); opacity:0.8">CIPA 25/26</span></span>
        </div>
        
        <div class="header-actions">
            <div class="theme-dropdown-container">
                <button class="theme-trigger-btn" onclick="toggleThemeMenu(event)"><i class="fas fa-palette"></i></button>
                <div id="theme-menu" class="theme-menu">
                    <button onclick="setTheme('light')"><i class="fas fa-sun"></i> Claro</button>
                    <button onclick="setTheme('orange')"><i class="fas fa-carrot"></i> Laranja</button>
                    <button onclick="setTheme('green')"><i class="fas fa-leaf"></i> Verde</button>
                    <button onclick="setTheme('dark')"><i class="fas fa-moon"></i> Escuro</button>
                </div>
            </div>
            <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <div class="content-wrapper">
        <div class="site-card">
            <div class="tabs">
                <button class="tab-btn active" id="tab-btn-veiculos" onclick="switchTab('tab-veiculos')"><i class="fas fa-car"></i> Veículos</button>
                <button class="tab-btn" id="tab-btn-ocorrencias" onclick="switchTab('tab-ocorrencias')"><i class="fas fa-exclamation-triangle"></i> Ocorrências</button>
                <button class="tab-btn" id="tab-btn-ranking" onclick="switchTab('tab-ranking')"><i class="fas fa-chart-line"></i> Ranking</button>
            </div>

            <!-- VEICULOS (CADASTRO) -->
            <div id="tab-veiculos" class="tab-content active">
                <h2><i class="fas fa-id-card"></i> Cadastro</h2>
                <input type="hidden" id="editIdPessoa">
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px">
                    <input id="nome" placeholder="Nome Completo">
                    <input id="cpf" placeholder="CPF" oninput="mascaraCPF(this)" maxlength="14">
                    <input id="contato" placeholder="Contato (WhatsApp/Celular)" oninput="mascaraTelefone(this)" maxlength="15">
                </div>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-top: 5px;">
                    <select id="setor">
                        <option value="" disabled selected>Setor</option>
                        <option value="ADMINISTRATIVO/ADMINISTRAÇÃO">ADMINISTRATIVO/ADMINISTRAÇÃO</option>
                        <option value="COMERCIAL/MERCHANDISING">COMERCIAL/MERCHANDISING</option>
                        <option value="DEPOSITO/LOGÍSTICA">DEPOSITO/LOGÍSTICA</option>
                        <option value="TRANSPORTE">TRANSPORTE</option>
                    </select>
                    <select id="tipo">
                        <option value="BICICLETA">BICICLETA</option>
                        <option value="CARRO">CARRO</option>
                        <option value="MOTO">MOTO</option>
                        <option value="MOTONETA">MOTONETA</option>
                    </select>
                    <input id="modelo" placeholder="Modelo (Ex: Titan 160)">
                    <input id="placa" placeholder="Placa">
                </div>
                <button class="btn-action" id="btnCadastrarPessoa" onclick="cadastrarPessoa()">Salvar Proprietário</button>
                <button class="btn-action" id="btnCancelarPessoa" onclick="limparCamposPessoa()" style="background: #6c757d; display: none;">Cancelar</button>
                
                <hr style="margin: 25px 0; border: none; border-top: 1px solid var(--border-color);">
                
                <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                    <h2><i class="fas fa-list-ul"></i> Cadastrados <span id="totalVeiculos" class="total-badge">0</span></h2>
                </div>

                <!-- FILTRO DE PESQUISA NA ABA DE CADASTRO -->
                <div class="filter-group">
                    <div class="search-input-wrapper">
                        <label>PESQUISAR NOME</label>
                        <input type="text" id="filtroNomeCad" placeholder="Ex: Jonatas..." oninput="listarPessoas()">
                        <i class="fas fa-search"></i>
                    </div>
                    <div>
                        <label>SETOR</label>
                        <select id="filtroSetorCad" onchange="listarPessoas()">
                            <option value="TODOS">TODOS SETORES</option>
                            <option value="ADMINISTRATIVO/ADMINISTRAÇÃO">ADMINISTRATIVO/ADMINISTRAÇÃO</option>
                            <option value="COMERCIAL/MERCHANDISING">COMERCIAL/MERCHANDISING</option>
                            <option value="DEPOSITO/LOGÍSTICA">DEPOSITO/LOGÍSTICA</option>
                            <option value="TRANSPORTE">TRANSPORTE</option>
                        </select>
                    </div>
                </div>

                <table id="tabelaPessoas">
                    <thead><tr><th>#</th><th>Nome</th><th>Setor</th><th>Contato</th><th>Modelo</th><th>Placa</th><th>Ações</th></tr></thead>
                    <tbody id="corpoTabelaPessoas"></tbody>
                </table>
            </div>

            <!-- OCORRENCIAS -->
            <div id="tab-ocorrencias" class="tab-content">
                <h2><i class="fas fa-exclamation-circle"></i> Registrar Advertência</h2>
                <input type="hidden" id="editId">
                <input id="responsavelSetor" type="hidden">
                <input id="responsavelModelo" type="hidden">
                <input id="responsavelTipo" type="hidden">

                <div style="display: flex; gap: 8px; align-items: flex-end;">
                    <input id="placaBusca" placeholder="Pesquisar Placa..." style="flex: 1;">
                    <button class="btn-action" id="btnBuscarPlaca" onclick="buscarProprietario()" style="width: auto; padding: 0 15px; height: 46px; margin: 6px 0;">Buscar</button>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; margin-top: -2px; padding-left: 5px;">
                    <input type="checkbox" id="checkAvulso" onchange="toggleAvulso()" style="width: 16px; height: 16px; margin: 0; cursor: pointer;">
                    <label for="checkAvulso" style="font-size: 12px; color: var(--text-muted); cursor: pointer; font-weight: 600;">Lançamento Avulso (Não cadastrado)</label>
                </div>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px">
                    <input id="responsavel" readonly placeholder="Responsável" style="opacity:0.8; background:#f9f9f9">
                    <input id="tipoModeloConfirmacao" readonly placeholder="Tipo / Modelo do Veículo" style="opacity:0.8; background:#f9f9f9; color: var(--primary-color); font-weight: 600;">
                </div>
                <div style="display:grid; grid-template-columns: 1fr; gap:0px">
                    <input id="motivo" placeholder="Motivo da infração...">
                </div>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px">
                    <input id="autor" placeholder="Autor">
                    <div class="photo-input-container">
                        <input id="foto" placeholder="URL da Foto (opcional)">
                        <span style="font-size: 11px; color: var(--text-muted); font-weight: 700;">OU</span>
                        <input type="file" id="uploadFoto" accept="image/*" style="display:none" onchange="handleFileUpload(this)">
                        <button type="button" class="btn-upload-trigger" id="btnUploadFoto" onclick="document.getElementById('uploadFoto').click()">
                            <i class="fas fa-camera"></i> Upload
                        </button>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-action" id="btnRegistrarAdv" onclick="salvarAdvertencia()">Registrar</button>
                    <button class="btn-action" id="btnCancelarAdv" onclick="limparCamposAdvertencia()" style="background: #6c757d; display: none;">Cancelar</button>
                </div>

<script>
    const CONFIG = {
        SUPABASE_URL: "https://fzszftykbatlfjvqdvbr.supabase.co",

        LOGO_URL: "https://i.ibb.co/svKWyZ49/cipa-logo.png"
    };

    const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

    function showMsg(msg) {

    function handleFileUpload(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 1500000) {
            showMsg("Imagem muito grande! Máximo 1.5MB.");
            input.value = "";
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            base64FotoUpload = e.target.result;
            const btn = document.getElementById("btnUploadFoto");
            btn.classList.add("has-file");
            btn.innerHTML = `<i class="fas fa-check"></i> Foto Carregada`;
            showMsg("Foto pronta!");
        };
        reader.readAsDataURL(file);
    }

    function toggleThemeMenu(event) {
        event.stopPropagation();
        document.getElementById('theme-menu').classList.toggle('active');
    }

    function setTheme(themeName) {
        document.body.classList.remove('theme-orange', 'theme-dark', 'theme-green');
        if (themeName !== 'light') document.body.classList.add('theme-' + themeName);

    async function realizarLogin() {
        const email = document.getElementById('emailLogin').value.trim();
        const password = document.getElementById('passLogin').value.trim();
        if (!email || !password) { showMsg("Informe e-mail e senha."); return; }
        const btn = document.getElementById('btnLoginAction');
        btn.innerText = "Entrando..."; btn.disabled = true;
        try {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            document.body.classList.add('site-mode');
            document.getElementById('login-screen').style.display = 'none';

            showMsg("Acesso negado."); 
            btn.innerText = "Entrar"; 
            btn.disabled = false; 
        }

    async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

    window.onload = async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            document.body.classList.add('site-mode');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';

            configurarDatasPadrao();

    function mascaraCPF(input) {
        let v = input.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        if (v.length > 9) input.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        else if (v.length > 6) input.value = v.replace(/(\d{3})(\d{3})(\d{3})/, "$1.$2.$3");
        else if (v.length > 3) input.value = v.replace(/(\d{3})(\d{3})/, "$1.$2");
        else input.value = v;
    }

    function mascaraTelefone(input) {
        let v = input.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        if (v.length > 10) input.value = v.replace(/^(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
        else if (v.length > 6) input.value = v.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
        else if (v.length > 2) input.value = v.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
        else input.value = v;
    }

    function configurarDatasPadrao() {
        const now = new Date();
        const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
        document.getElementById("histDataInicio").value = start;
        document.getElementById("histDataFim").value = end;
        document.getElementById("dataInicio").value = start;
        document.getElementById("dataFim").value = end;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById('tab-btn-' + tabId.replace('tab-', '')).classList.add('active');
        if(tabId === 'tab-ranking') gerarRanking();
        if(tabId === 'tab-ocorrencias') listar();
        if(tabId === 'tab-veiculos') listarPessoas();
    }

    async function cadastrarPessoa() {
        const btn = document.getElementById("btnCadastrarPessoa");
        const n = document.getElementById("nome").value.trim();
        const c = document.getElementById("cpf").value.trim();
        const tel = document.getElementById("contato").value.trim();
        const s = document.getElementById("setor").value;
        const t = document.getElementById("tipo").value;
        const m = document.getElementById("modelo").value.trim();
        const p = document.getElementById("placa").value.trim().toUpperCase();
        const eid = document.getElementById("editIdPessoa").value;
        
        if(!n || !p || !c || !s) { showMsg("Preencha os campos obrigatórios."); return; }
        btn.disabled = true; btn.innerText = "Processando...";
        
        // Remove contato from payload initially to prevent schema error if not created yet
        const payload = { nome: n, cpf: c, setor: s, tipo: t, modelo: m, placa: p };
        
        // Only add contato to payload if it's not empty, trying to save it. 
        // If it fails due to schema, we will catch it below.
        if (tel) {
             payload.contato = tel;
        }

        try {
            const { error } = eid 
                ? await supabaseClient.from('pessoas').update(payload).eq('id', eid)
                : await supabaseClient.from('pessoas').insert([payload]);
            
            if(error) {
                if(error.message.includes("Could not find the 'contato' column")) {
                    showMsg("Crie a coluna 'contato' (tipo text) no Supabase!");
                } else {
                    showMsg("Erro: " + error.message);
                }
            }
            else { showMsg(eid ? "Atualizado!" : "Salvo!"); limparCamposPessoa(); listarPessoas(); }
        } catch (e) { showMsg("Falha na conexão."); } finally { btn.disabled = false; }
    }

    async function listarPessoas() {
        const { data, error } = await supabaseClient.from('pessoas').select('*');
        if(error) { console.error(error); return; }
        pessoasCache = data || [];
        
        const corpo = document.getElementById("corpoTabelaPessoas");
        const fNome = document.getElementById("filtroNomeCad") ? document.getElementById("filtroNomeCad").value.toLowerCase() : "";
        const fSetor = document.getElementById("filtroSetorCad") ? document.getElementById("filtroSetorCad").value : "TODOS";
        
        corpo.innerHTML = "";
        
        const filtrados = pessoasCache.filter(p => {
            const matchNome = (p.nome || "").toLowerCase().includes(fNome);
            const matchSetor = fSetor === "TODOS" || p.setor === fSetor;
            return matchNome && matchSetor;
        }).sort((a,b)=>(a.nome || "").localeCompare(b.nome || ""));

        if (document.getElementById("totalVeiculos")) {
            document.getElementById("totalVeiculos").innerText = filtrados.length;
        }

        filtrados.forEach((p, index) => {
            corpo.innerHTML += `<tr>
                <td data-label="#">${index + 1}</td>
                <td data-label="Nome">${p.nome || ''}</td>
                <td data-label="Setor">${p.setor || ''}</td>
                <td data-label="Contato">${p.contato || '-'}</td>
                <td data-label="Modelo">${p.modelo || '-'}</td>
                <td data-label="Placa"><strong>${p.placa || ''}</strong></td>
                <td data-label="Ações">
                    <div class="acoes-wrapper"><button class="btn-acao-menu" onclick="toggleMenu(event, 'p-${p.id}')"><i class="fas fa-ellipsis-v"></i></button>
                    <div id="menu-p-${p.id}" class="menu-opcoes">
                        <button onclick="verDetalhesPessoa('${(p.nome || '').replace(/'/g, "\\'")}')">Histórico</button>
                        <button onclick="editarPessoa('${p.id}')">Editar</button>
                        <button onclick="excluirPessoa('${p.id}')" style="color:red">Excluir</button>
                    </div></div>
                </td>
            </tr>`;
        });
    }

    function editarPessoa(id) {
        const p = pessoasCache.find(i => i.id == id);

        document.getElementById("modelo").value = p.modelo || "";

    async function salvarAdvertencia() {
        const isAvulso = document.getElementById("checkAvulso").checked;
        const nome = document.getElementById("responsavel").value.trim() || (isAvulso ? "Não Cadastrado" : "");
        const motivo = document.getElementById("motivo").value.trim();
        if(!nome || !motivo) { showMsg("Dados incompletos."); return; }
        const finalFoto = base64FotoUpload || document.getElementById("foto").value;
        
        let tipoFinal = document.getElementById("responsavelTipo").value;
        let modeloFinal = document.getElementById("responsavelModelo").value;
        let setorFinal = document.getElementById("responsavelSetor").value;
        
        if (isAvulso) {
            tipoFinal = "Avulso";
            modeloFinal = document.getElementById("tipoModeloConfirmacao").value.trim();
            setorFinal = "N/A";
        }

        const payload = {
            placa: document.getElementById("placaBusca").value.toUpperCase(),
            nome: nome, 
            setor: setorFinal,
            modelo: modeloFinal,
            tipo: tipoFinal,
            motivo: motivo, 
            autor: document.getElementById("autor").value,
            foto: finalFoto, 
            data: new Date().toLocaleDateString('pt-BR')
        };
        const eid = document.getElementById("editId").value;
        try {
            const { error } = eid ? await supabaseClient.from('advertencias').update(payload).eq('id', eid) : await supabaseClient.from('advertencias').insert([payload]);
            if(error) showMsg("Erro: " + error.message);
            else showMsg("Sucesso!");
            limparCamposAdvertencia(); listar();
        } catch (e) { showMsg("Erro técnico."); }
    }

    async function listar() {
        const { data } = await supabaseClient.from('advertencias').select('*');
        if(!data) return;
        advertenciasCache = data;
        const corpo = document.getElementById("corpoTabela");
        corpo.innerHTML = "";
        const fIniInput = document.getElementById("histDataInicio").value;
        const fFimInput = document.getElementById("histDataFim").value;
        const fIni = fIniInput ? new Date(fIniInput) : null;
        const fFim = fFimInput ? new Date(fFimInput) : null;
        const fSet = document.getElementById("histSetor").value;
        data.filter(a => {
            const dp = (a.data || "").split('/');
            if (dp.length < 3) return false;
            const d = new Date(dp[2], dp[1]-1, dp[0]);
            if(fIni && d < fIni) return false;
            if(fFim && d > fFim) return false;
            if(fSet !== "TODOS") {
                if(a.setor !== fSet) return false;
            }
            return true;
        }).reverse().forEach(a => {
            const tipoModeloDisplay = `${a.tipo || ''}${a.tipo && a.modelo ? ' - ' : ''}${a.modelo || ''}`;
            corpo.innerHTML += `<tr>
                <td data-label="Data">${a.data || ''}</td>
                <td data-label="Proprietário">${a.nome || ''}</td>
                <td data-label="Placa"><strong>${a.placa || ''}</strong></td>
                <td data-label="Tipo/Modelo">${tipoModeloDisplay || '-'}</td>
                <td data-label="Motivo">${a.motivo || ''}</td>
                <td data-label="Foto"><img src="${a.foto || 'https://via.placeholder.com/60'}" class="img-historico" onclick="abrirModal('${a.foto}')" onerror="this.src='https://via.placeholder.com/60?text=S/F'"></td>
                <td data-label="Ações">
                    <div class="acoes-wrapper"><button class="btn-acao-menu" onclick="toggleMenu(event, '${a.id}')"><i class="fas fa-ellipsis-v"></i></button>
                    <div id="menu-${a.id}" class="menu-opcoes">
                        <button onclick="editarAdv('${a.id}')">Editar</button>
                        <button onclick="excluirAdv('${a.id}')" style="color:red">Excluir</button>
                    </div></div>
                </td>
            </tr>`;
        });
    }

    function editarAdv(id) {
        const a = advertenciasCache.find(i => i.id == id);
        if(!a) return;
        document.getElementById("editId").value = a.id;
        document.getElementById("placaBusca").value = a.placa || "";
        
        const isAvulso = (a.tipo === "Avulso" || a.nome === "Não Cadastrado");
        const checkAvulso = document.getElementById("checkAvulso");
        if(checkAvulso) {
            checkAvulso.checked = isAvulso;
            toggleAvulso();
        }

        document.getElementById("responsavel").value = a.nome || "";
        document.getElementById("responsavelSetor").value = a.setor || "";
        document.getElementById("responsavelModelo").value = a.modelo || "";
        document.getElementById("responsavelTipo").value = a.tipo || "";
        
        if (isAvulso) {
            document.getElementById("tipoModeloConfirmacao").value = a.modelo || "";
        } else {
            document.getElementById("tipoModeloConfirmacao").value = `${a.tipo || ''}${a.tipo && a.modelo ? ' - ' : ''}${a.modelo || ''}`;
        }
        
        document.getElementById("motivo").value = a.motivo || "";
        document.getElementById("autor").value = a.autor || "";
        document.getElementById("foto").value = (a.foto || "").startsWith("data:image") ? "" : a.foto;
        base64FotoUpload = (a.foto || "").startsWith("data:image") ? a.foto : "";
        const btn = document.getElementById("btnUploadFoto");
        if(base64FotoUpload) { btn.classList.add("has-file"); btn.innerHTML = `<i class="fas fa-check"></i> Foto Carregada`; }
        else { btn.classList.remove("has-file"); btn.innerHTML = `<i class="fas fa-camera"></i> Upload`; }
        document.getElementById("btnRegistrarAdv").innerText = "Atualizar Registro";
        document.getElementById("btnCancelarAdv").style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function excluirAdv(id) {
        if(!confirm("Remover ocorrência?")) return;
        try {
            const { error } = await supabaseClient.from('advertencias').delete().eq('id', id);
            if (error) {
                showMsg("Erro ao excluir: " + error.message);
            } else {
                showMsg("Ocorrência removida!");
                listar();
            }
        } catch (e) { showMsg("Erro técnico."); }
    }

    async function gerarRanking() {
        const { data } = await supabaseClient.from('advertencias').select('*');
        if(!data) return;
        const counts = {};
        data.forEach(a => counts[a.nome] = (counts[a.nome] || 0) + 1);
        currentRanking = Object.entries(counts).map(([n, t]) => ({ n, t })).sort((a,b)=>b.t-a.t);
        const corpo = document.getElementById("corpoRanking");
        corpo.innerHTML = "";
        currentRanking.forEach((item, i) => {
            const isC = item.t >= 3;
            corpo.innerHTML += `<tr class="${isC?'critico':''}">
                <td data-label="Posição">${i+1}º</td>
                <td data-label="Responsável">${item.n}</td>
                <td data-label="Total">${item.t}</td>
                <td data-label="Situação">${isC?'CORRETIVA':'Normal'}</td>
                <td data-label="Ação"><button class="btn-action" style="padding: 5px; font-size: 10px; margin:0; width:auto;" onclick="verDetalhesPessoa('${item.n.replace(/'/g, "\\'")}')">Ver</button></td>
            </tr>`;
        });
    }

    async function verDetalhesPessoa(nome) {
        const { data } = await supabaseClient.from('advertencias').select('*').eq('nome', nome);
        currentDetailsData = data || [];
        currentDetailsName = nome;
        const lista = document.getElementById("detalhesLista");
        document.getElementById("detalhesTitulo").innerText = nome;
        lista.innerHTML = "";
        if(!currentDetailsData.length) lista.innerHTML = "<p>Sem histórico.</p>";
        else currentDetailsData.reverse().forEach(adv => {
            lista.innerHTML += `<div class="detalhe-item">
                <img src="${adv.foto}" class="img-detalhe" onclick="abrirModal('${adv.foto}')" onerror="this.src='https://via.placeholder.com/100'">
                <div><b>Data: ${adv.data}</b> ${adv.modelo ? `<br><small>(${adv.tipo || ''} - ${adv.modelo})</small>` : ''}<p style="font-size:13px; margin: 5px 0;">${adv.motivo}</p></div>
            </div>`;
        });
        document.getElementById("modalDetalhes").style.display = "flex";
    }

    function toggleMenu(event, id) { if(event) event.stopPropagation(); const m = document.getElementById(`menu-${id}`); if(!m) return; const act = m.classList.contains('active'); fecharTodosMenus(); if(!act) m.classList.add('active'); }
    function fecharTodosMenus() { document.querySelectorAll('.menu-opcoes, .theme-menu').forEach(m => m.classList.remove('active')); }
    function abrirModal(u) { if(!u) return; document.getElementById("imgModal").src = u; document.getElementById("modal").style.display = "flex"; }
    function fecharModal() { document.getElementById("modal").style.display = "none"; }
    function fecharModalDetalhes() { document.getElementById("modalDetalhes").style.display = "none"; }
    function limparCamposAdvertencia() { 
        document.getElementById("editId").value = ""; document.getElementById("placaBusca").value = ""; document.getElementById("responsavel").value = ""; 
        document.getElementById("responsavelModelo").value = ""; document.getElementById("responsavelTipo").value = ""; 
        document.getElementById("tipoModeloConfirmacao").value = ""; document.getElementById("motivo").value = ""; 
        document.getElementById("foto").value = ""; document.getElementById("uploadFoto").value = ""; base64FotoUpload = "";
        
        const checkAvulso = document.getElementById("checkAvulso");
        if(checkAvulso) { checkAvulso.checked = false; toggleAvulso(); }
        
        const btn = document.getElementById("btnUploadFoto"); btn.classList.remove("has-file"); btn.innerHTML = `<i class="fas fa-camera"></i> Upload`;
        document.getElementById("btnRegistrarAdv").innerText = "Registrar"; document.getElementById("btnCancelarAdv").style.display = "none";
    }

    // --- PDF ---
    function getCurrentThemeColor() { return getComputedStyle(document.body).getPropertyValue('--primary-color').trim() || '#FF6A14'; }
    function hexToRgb(hex) {
        let r = 0, g = 0, b = 0;
        if (hex.startsWith('#')) { r = parseInt(hex.substring(1, 3), 16); g = parseInt(hex.substring(3, 5), 16); b = parseInt(hex.substring(5, 7), 16); }
        else if (hex.startsWith('rgb')) { let res = hex.match(/\d+/g); r = parseInt(res[0]); g = parseInt(res[1]); b = parseInt(res[2]); }
        return [r, g, b];
    }
    async function getBase64Image(url) {
        if (!url || url === "" || url.includes("placeholder")) return null;
        if (url.startsWith("data:image")) return url;
        try { const res = await fetch(url, { mode: 'cors' }); if (!res.ok) return null; const blob = await res.blob(); return new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(blob); }); } catch { return null; }
    }

    async function gerarPDFHistorico() {
        const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'pt', 'a4'); const color = hexToRgb(getCurrentThemeColor());
        showMsg("Gerando Relatório...");
        const logo = await getBase64Image(CONFIG.LOGO_URL); if (logo) doc.addImage(logo, 'PNG', 40, 20, 40, 40);
        doc.setFontSize(18); doc.setTextColor(color[0], color[1], color[2]); doc.text("Histórico Geral de Infrações", 100, 45);
        const rows = Array.from(document.querySelectorAll("#corpoTabela tr")); const bodyData = [];
        for (let tr of rows) {
            const cells = tr.querySelectorAll("td"); const imgEl = cells[5].querySelector("img");
            const b64 = await getBase64Image(imgEl ? imgEl.src : "");
            bodyData.push([cells[0].innerText, cells[1].innerText, cells[2].innerText, cells[3].innerText, cells[4].innerText, b64]);
        }
        doc.autoTable({
            startY: 80, head: [['Data', 'Proprietário', 'Placa', 'Tipo/Modelo', 'Motivo', 'Evidência']],
            body: bodyData, bodyStyles: { minCellHeight: 65 }, styles: { fontSize: 9, valign: 'middle' },
            headStyles: { fillColor: color }, 
            didDrawCell: (data) => { if (data.column.index === 5 && data.cell.section === 'body' && data.cell.raw) doc.addImage(data.cell.raw, 'JPEG', data.cell.x + 10, data.cell.y + 5, 60, 45); },
            didParseCell: (data) => { if (data.column.index === 5 && data.section === 'body') data.cell.text = ''; }
        });
        doc.save("Historico_Geral.pdf"); showMsg("Pronto!");
    }

    async function gerarPDFRanking() {
        const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'pt', 'a4'); const color = hexToRgb(getCurrentThemeColor());
        showMsg("Gerando Ranking...");
        const logo = await getBase64Image(CONFIG.LOGO_URL); if (logo) doc.addImage(logo, 'PNG', 40, 20, 40, 40);
        doc.setFontSize(18); doc.setTextColor(color[0], color[1], color[2]); doc.text("Ranking de Infrações - CIPA", 95, 45);
        const dataRows = currentRanking.map((item, i) => [`${i+1}º`, item.n, item.t, item.t >= 3 ? "CORRETIVA" : "NORMAL"]);
        doc.autoTable({ startY: 80, head: [['Posição', 'Nome', 'Total', 'Situação']], body: dataRows, headStyles: { fillColor: color } });
        doc.save("Ranking_CIPA.pdf"); showMsg("Pronto!");
    }

    async function gerarPDFDetalhes() {
        if (!currentDetailsData.length) return;
        const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'pt', 'a4'); const color = hexToRgb(getCurrentThemeColor());
        showMsg("Gerando Histórico Individual...");
        const logo = await getBase64Image(CONFIG.LOGO_URL); if (logo) doc.addImage(logo, 'PNG', 40, 20, 40, 40);
        doc.setFontSize(18); doc.setTextColor(color[0], color[1], color[2]); doc.text(`Histórico: ${currentDetailsName}`, 95, 45);
        doc.setFontSize(10); doc.setTextColor(100); doc.text("Relatório individual de advertências - CIPA 25/26", 95, 60);
        const bodyData = [];
        for (let adv of currentDetailsData) {
            const b64 = await getBase64Image(adv.foto);
            const tm = `${adv.tipo || ''}${adv.tipo && adv.modelo ? ' - ' : ''}${adv.modelo || ''}`;
            bodyData.push([adv.data, adv.placa || '-', tm, adv.motivo, b64]);
        }
        doc.autoTable({
            startY: 85, head: [['Data', 'Placa', 'Tipo/Modelo', 'Motivo', 'Evidência']],
            body: bodyData, bodyStyles: { minCellHeight: 80 }, styles: { valign: 'middle' },
            headStyles: { fillColor: color },
            didDrawCell: (data) => { if (data.column.index === 4 && data.cell.section === 'body' && data.cell.raw) doc.addImage(data.cell.raw, 'JPEG', data.cell.x + 10, data.cell.y + 10, 80, 60); },
            didParseCell: (data) => { if (data.column.index === 4 && data.section === 'body') data.cell.text = ''; }
        });
        doc.save(`Historico_${currentDetailsName.replace(/\s+/g, '_')}.pdf`); showMsg("Pronto!");
    }
</script>
